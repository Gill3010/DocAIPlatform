# Nginx para docaiplatform.com CON SSL (Certificado Origin de Cloudflare)
# Requiere: /etc/nginx/ssl/docaiplatform-cert.pem y docaiplatform-key.pem
# Ver: docs/CLOUDFLARE-SSL-ORIGIN-SETUP.md

# Map para WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend {
    server 127.0.0.1:8000;
}

upstream collab_ws {
    server 127.0.0.1:3001;
}

# Redirigir HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name docaiplatform.com www.docaiplatform.com;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS (Cloudflare Full strict se conecta aquí)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docaiplatform.com www.docaiplatform.com;

    # Certificado Origin de Cloudflare
    ssl_certificate     /etc/nginx/ssl/docaiplatform-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/docaiplatform-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    # API
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket colaboración - directo al servidor collab (3001), sin pasar por FastAPI
    location /ws/collab/ {
        proxy_pass http://collab_ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Health check
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Archivos estáticos
    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Frontend (SPA)
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
