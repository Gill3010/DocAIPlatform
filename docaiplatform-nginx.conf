# Nginx para docaiplatform.com
# Instalación: sudo cp docaiplatform-nginx.conf /etc/nginx/conf.d/docaiplatform.conf && sudo nginx -t && sudo systemctl reload nginx

# Map para WebSocket: asegura Connection: upgrade cuando hay Upgrade header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name docaiplatform.com www.docaiplatform.com;

    client_max_body_size 50M;

    # API
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket colaboración (ruta /ws/collab para evitar conflicto con SPA /collab/:id)
    location /ws/collab/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Health check
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Archivos estáticos del backend
    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Frontend (SPA + assets) - el backend sirve desde frontend/dist
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
